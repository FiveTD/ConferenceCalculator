[package]
name = "conference-calculator"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

# Small optimizations in the dev profile
[profile.dev]
opt-level = 1

# Large optimizations for dev dependencies
[profile.dev.package."*"]
opt-level = 3